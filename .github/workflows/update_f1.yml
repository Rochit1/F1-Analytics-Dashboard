name: Update F1 Data

on:
  schedule:
    # Runs every Monday at 06:00 UTC. GitHub Actions cron is UTC only —
    # adjust the hour if you want it to land at a specific local time.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

# Required so the workflow's GITHUB_TOKEN is allowed to push commits back to the repo.
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run F1 data pipeline
        run: python python/f1_pipeline.py

      - name: Commit and push updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated F1 data update $(date -u +'%Y-%m-%d')"
            git push
          fi
