name: Update F1 Data

on:
  schedule:
    # Runs every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run F1 data pipeline
        run: python python/f1_pipeline.py

      - name: Run OpenF1 enrichment
        run: python python/openf1_enrichment.py

      - name: Commit and push updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated F1 data update $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Load data into Supabase
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python sql/load_to_supabase.py

      - name: Run ML predictions
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ml/f1_predictions.py

      - name: Commit and push updated ML outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ml/outputs/*.csv
          if git diff --cached --quiet; then
            echo "No ML output changes to commit."
          else
            git commit -m "Automated ML prediction update $(date -u +'%Y-%m-%d')"
            git push
          fi
